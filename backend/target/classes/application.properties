server.port=${SERVER_PORT:8080}

spring.application.name=CloudCostLens

# ==================== Supabase (PostgreSQL) JPA ====================
spring.datasource.url=jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:6543/postgres?prepareThreshold=0&ssl=true&sslmode=require
spring.datasource.username=postgres.mdcrhrvhxfbkseuozkea
spring.datasource.password=${SUPABASE_DB_PASSWORD:Devops@99ops}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ==================== MVC ====================
spring.mvc.pathmatch.matching-strategy=path_pattern_parser

# ==================== Jackson ====================
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=NON_NULL

# ==================== Logging ====================
logging.level.com.awsplanner=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ==================== Static Resources ====================
spring.web.resources.static-locations=classpath:/static/

# ==================== Async (for Terraform ProcessBuilder) ====================
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=25
spring.task.execution.thread-name-prefix=terraform-

# ==================== Terraform Config ====================
# Path to the terraform environments/dynamic directory (relative to backend run dir)
terraform.environment.path=../terraform/environments/dynamic
# Base directory for per-deployment workspaces
terraform.workspace.base=../terraform/workspaces
# Terraform binary name (must be in PATH)
terraform.binary=terraform

# ==================== AWS Credentials ====================
# These are read from OS environment variables set by start-backend.bat (which loads .env).
# Spring also binds them here as a fallback for IDEs / direct Maven runs.
# NEVER hardcode real values here — use the .env file.
aws.access.key.id=${AWS_ACCESS_KEY_ID:}
aws.secret.access.key=${AWS_SECRET_ACCESS_KEY:}
aws.region=${AWS_DEFAULT_REGION:us-east-1}

# ==================== Admin & Security ====================
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}
jwt.secret=${JWT_SECRET:very-secure-random-secret-key-that-is-long-enough}
jwt.expiration=86400000
